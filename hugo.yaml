baseURL: https://example.org/
locale: en-us
title: My New Hugo Project

menus:
  main:
    - title: "Home"
      pageRef: "/"
      identifier: home
      weight: 10
    - title: "à propos"
      pageRef: "/about/"
      identifier: about
      weight: 20
    - title: "services"
      pageRef: "/services/"
      identifier: services
      weight: 30
    - title: "Articles"
      pageRef: "/articles/"
      identifier: articles
      weight: 40



build:
  buildStats:
    enable: true
  cachebusters:
  - source: 'assets/notwatching/hugo_stats\.json'
    target: css
  - source: '(postcss|tailwind)\.config\.js'
    target: css
module:
  mounts:
  - source: assets
    target: assets
  - disableWatch: true
    source: hugo_stats.json
    target: assets/notwatching/hugo_stats.json