baseURL: https://example.org/
locale: en-us
title: My New Hugo Project

menus:
  main:
    - title: "Home"
      pageRef: "/"
      identifier: home
      weight: 10
    - title: "Le livre"
      pageRef: "/book/"
      identifier: le-livre
      weight: 20
    - title: "Rezoway"
      pageRef: "/rezoway/"
      identifier: rzoway
      weight: 30

params:
  socials:
    facebook: "https://facebook.com"
    linkedin: "https://linkedin.com"
   

caches:
  images:
    dir: :cacheDir/images

build:
  buildStats:
    enable: true
  cachebusters:
  - source: 'assets/notwatching/hugo_stats\.json'
    target: css
  - source: '(postcss|tailwind)\.config\.js'
    target: css
module:
  mounts:
  - source: assets
    target: assets
  - disableWatch: true
    source: hugo_stats.json
    target: assets/notwatching/hugo_stats.json